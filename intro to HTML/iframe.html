<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IFrames</title>
</head>
<body>
    <h1>This is an example of iframe</h1>
    <iframe src="https://www.codewithharry.com/" width="600" height="400"></iframe>
    <iframe src="https://www.youtube.com/" width="600" height="400"></iframe>
    <iframe src="https://www.wikipedia.org" width="800" height="500"></iframe>
    <iframe width="560" height="315" src="https://www.youtube.com/embed/m4qKrVQ6TRw?si=85AxRaLuBSSgpbyv" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

</body>
</html>
