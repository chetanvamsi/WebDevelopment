<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bold_italic_unline</title>
</head>
<body>
    <p>I am a good <b>Boy</b></p>
    <p>I am a good <i>Boy</i></p>
    <p>I am a good <u>Boy</u></p>
    <p>I am a good <s>Boy</s></p>
    <p>I am a good <del>Boy</del></p>
    <p>H<sub>2</sub>O</p>
    <p>2<sup>n</sup></p>
    <p>This is <b><i>bold and italic</i></b> text.</p>
    
</body>
</html>
